<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Project — Juniper Design Homes</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .album { padding: 7rem 0 4rem; }
    .album-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; }
    .album-grid img { width: 100%; height: 420px; object-fit: cover; background: #ddd; }
    .album-grid figure:nth-child(3n) { grid-column: 1 / -1; }
    .album-grid figure:nth-child(3n) img { height: 560px; }
    @media (max-width: 700px) {
      .album-grid { grid-template-columns: 1fr; }
      .album-grid figure:nth-child(3n) { grid-column: auto; }
      .album-grid img, .album-grid figure:nth-child(3n) img { height: 260px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="index.html">
        <img src="https://juniperdesignhomes.com/juniper-header-logo-approved.png" alt="Juniper Design Homes" class="brand-logo" />
      </a>
      <nav class="nav">
        <a href="index.html#work">Work</a>
        <a href="index.html#about">About</a>
        <a href="index.html#contact">Contact</a>
      </nav>
    </div>
  </header>
  <main class="album">
    <div class="container">
      <p class="eyebrow" id="num">Chapter</p>
      <h1 id="title" style="font-size:clamp(2.4rem,6vw,4.4rem);color:var(--ink)">Project</h1>
      <div class="album-grid" id="album"></div>
      <p style="margin-top:2rem"><a class="text-link" href="index.html#work" style="color:var(--forest)">← All chapters</a></p>
    </div>
  </main>
  <script src="projects.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const slug = params.get("p");
    const list = window.PROJECTS || [];
    const idx = list.findIndex((p) => p.slug === slug);
    const project = list[idx];
    if (!project) {
      document.getElementById("title").textContent = "Project not found";
    } else {
      document.title = project.title + " — Juniper Design Homes";
      document.getElementById("num").textContent = "Chapter " + String(idx + 1).padStart(2, "0");
      document.getElementById("title").textContent = project.title;
      const skip = new Set(project.skip || []);
      const keep = project.keep ? new Set(project.keep) : null;
      const urls = [];
      for (let n = 1; n <= project.count; n++) {
        if (keep && !keep.has(n)) continue;
        if (skip.has(n)) continue;
        urls.push(window.IMG(project.slug, n));
        if (project.insertAfter === n) (project.extra || []).forEach((u) => urls.push(u));
      }
      if (!project.insertAfter) (project.extra || []).forEach((u) => urls.push(u));
      const album = document.getElementById("album");
      urls.forEach((src, i) => {
        const fig = document.createElement("figure");
        const img = document.createElement("img");
        img.src = src;
        img.alt = project.title + " " + String(i + 1).padStart(2, "0");
        img.onerror = () => fig.remove();
        fig.appendChild(img);
        album.appendChild(fig);
      });
    }
  </script>
</body>
</html>
